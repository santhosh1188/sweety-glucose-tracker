services:
  db:
    image: postgres:16-alpine
    container_name: sweety-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
    ports:
      - "5433:5432" # host port 5433, so it doesn't clash with a local PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sweety}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    container_name: sweety-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sweety}
      JWT_SECRET: ${JWT_SECRET:-change-me-for-local-use-only}
      JWT_EXPIRES_IN: 7d
      APP_TIMEZONE: Asia/Kolkata
    ports:
      - "5000:5000"

volumes:
  pgdata: